# Backup diário do banco de produção (Neon).
#
# O que acontece todo dia de madrugada:
#   1. pg_dump copia o banco inteiro (estrutura + dados).
#   2. A cópia é criptografada com uma senha (BACKUP_PASSPHRASE). Sem ela, o arquivo é inútil.
#   3. Testamos a cópia: restauramos num Postgres temporário e contamos as tabelas/usuários.
#      Backup que nunca foi testado não é backup.
#   4. O arquivo criptografado vai para o bucket PRIVADO do R2, na pasta backups/.
#   5. Cópias com mais de 30 dias são apagadas.
#
# Segredos necessários (GitHub > Settings > Secrets and variables > Actions):
#   NEON_BACKUP_URL        URL do Neon SEM pooler (o host não tem "-pooler")
#   BACKUP_PASSPHRASE      senha longa para criptografar (guarde num gerenciador de senhas!)
#   R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, R2_ENDPOINT, R2_BACKUP_BUCKET
#
# Como restaurar: docs/backup.md
name: Backup do banco

on:
  schedule:
    - cron: "17 6 * * *" # 06:17 UTC = 03:17 em Brasília
  workflow_dispatch: # botão "Run workflow" para rodar na hora

concurrency:
  group: backup
  cancel-in-progress: false

permissions:
  contents: read

env:
  PG_IMAGE: postgres:17 # o pg_dump precisa ser da mesma versão do Neon ou mais nova
  RETENTION_DAYS: 30

jobs:
  backup:
    name: Backup do Neon para o R2
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Postgres temporário só para testar se a cópia restaura.
    services:
      restore-test:
        image: postgres:17
        env:
          POSTGRES_USER: restore
          POSTGRES_PASSWORD: restore
          POSTGRES_DB: restore
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U restore"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Conferir segredos
        env:
          NEON_BACKUP_URL: ${{ secrets.NEON_BACKUP_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
          R2_BACKUP_BUCKET: ${{ secrets.R2_BACKUP_BUCKET }}
        run: |
          missing=""
          [ -z "$NEON_BACKUP_URL" ] && missing="$missing NEON_BACKUP_URL"
          [ -z "$BACKUP_PASSPHRASE" ] && missing="$missing BACKUP_PASSPHRASE"
          [ -z "$R2_BACKUP_BUCKET" ] && missing="$missing R2_BACKUP_BUCKET"
          if [ -n "$missing" ]; then echo "::error::Segredos faltando:$missing"; exit 1; fi
          case "$NEON_BACKUP_URL" in
            *-pooler*) echo "::error::Use a URL SEM pooler (o pg_dump não funciona bem pelo pooler)"; exit 1 ;;
          esac

      - name: Copiar o banco (pg_dump)
        env:
          NEON_BACKUP_URL: ${{ secrets.NEON_BACKUP_URL }}
        run: |
          mkdir -p backup
          # -Fc = formato "custom": comprimido e restaurável tabela por tabela.
          # --no-owner/--no-acl: a cópia restaura em qualquer banco, mesmo com outro usuário.
          docker run --rm --network host -v "$PWD/backup:/backup" -e DB="$NEON_BACKUP_URL" "$PG_IMAGE" \
            sh -c 'pg_dump "$DB" -Fc --no-owner --no-acl -f /backup/trackhub.dump'
          ls -lh backup/trackhub.dump

      - name: Testar a restauração
        run: |
          docker run --rm --network host -v "$PWD/backup:/backup" -e PGPASSWORD=restore "$PG_IMAGE" \
            pg_restore --no-owner --no-acl -h 127.0.0.1 -U restore -d restore /backup/trackhub.dump
          tables=$(docker run --rm --network host -e PGPASSWORD=restore "$PG_IMAGE" \
            psql -h 127.0.0.1 -U restore -d restore -tAc "select count(*) from information_schema.tables where table_schema='public'")
          users=$(docker run --rm --network host -e PGPASSWORD=restore "$PG_IMAGE" \
            psql -h 127.0.0.1 -U restore -d restore -tAc 'select count(*) from "User"')
          echo "Tabelas restauradas: $tables | Usuários: $users"
          if [ "$tables" -lt 10 ]; then echo "::error::A cópia restaurou poucas tabelas ($tables). Backup suspeito."; exit 1; fi
          echo "### Backup de $(date -u +%F)" >> "$GITHUB_STEP_SUMMARY"
          echo "Restaurado com sucesso: $tables tabelas, $users usuários." >> "$GITHUB_STEP_SUMMARY"

      - name: Criptografar
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          name="trackhub-$(date -u +%Y-%m-%dT%H%MZ).dump.gpg"
          echo "$BACKUP_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 \
            --symmetric --cipher-algo AES256 -o "backup/$name" backup/trackhub.dump
          rm backup/trackhub.dump # o arquivo sem criptografia não sai daqui
          echo "BACKUP_FILE=$name" >> "$GITHUB_ENV"

      - name: Enviar para o R2 e apagar cópias antigas
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BACKUP_BUCKET: ${{ secrets.R2_BACKUP_BUCKET }}
        run: |
          aws s3 cp "backup/$BACKUP_FILE" "s3://$R2_BACKUP_BUCKET/backups/$BACKUP_FILE" --endpoint-url "$R2_ENDPOINT" --only-show-errors
          echo "Enviado: backups/$BACKUP_FILE" >> "$GITHUB_STEP_SUMMARY"

          limit=$(date -u -d "-$RETENTION_DAYS days" +%Y-%m-%d)
          aws s3 ls "s3://$R2_BACKUP_BUCKET/backups/" --endpoint-url "$R2_ENDPOINT" | while read -r day _time _size file; do
            # Só apaga o que segue o nosso padrão de nome, e só se for mais antigo que o limite.
            case "$file" in trackhub-*.dump.gpg) ;; *) continue ;; esac
            if [[ "$day" < "$limit" ]]; then
              aws s3 rm "s3://$R2_BACKUP_BUCKET/backups/$file" --endpoint-url "$R2_ENDPOINT" --only-show-errors
              echo "Removido (mais de $RETENTION_DAYS dias): $file"
            fi
          done
